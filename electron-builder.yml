appId: com.nthings.ainterview
productName: ainterview
copyright: Copyright © 2024 nthings
directories:
  output: dist
  buildResources: resources
files:
  - from: .
    filter:
      - package.json
      - app
extraResources:
  - from: resources/whisper
    to: whisper
    filter:
      - ggml-base.en.bin
publish: null

mac:
  extraResources:
    - from: resources/whisper/mac
      to: whisper
  extendInfo:
    NSAudioCaptureUsageDescription: Capture the interviewer audio
    NSMicrophoneUsageDescription: Capture your microphone

win:
  target:
    - target: nsis
      arch: x64
  extraResources:
    - from: resources/whisper/win
      to: whisper
